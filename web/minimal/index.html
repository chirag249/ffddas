<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Frame Viewer</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin:0; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; }
    h1 { font-size:1.1rem; margin:16px 0 4px; }
    #frameWrapper { position:relative; }
    img { max-width:640px; width:100%; height:auto; display:block; border:2px solid #222; border-radius:4px; }
    #stats { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.55); padding:6px 8px; border-radius:4px; font-size:12px; line-height:1.3; }
    #stats div { display:flex; justify-content:space-between; gap:12px; }
    code { color:#8cf; }
    footer { margin:14px 0 24px; font-size:11px; opacity:.6; }
  </style>
</head>
<body>
  <h1>Processed Camera Frame</h1>
  <div id="frameWrapper">
    <img id="frame" alt="Processed Frame" src="../sample.png" />
    <div id="stats">
      <div><span>FPS:</span><span id="fpsVal">0</span></div>
      <div><span>Resolution:</span><span id="resVal">640x480</span></div>
      <div><span>Filter:</span><span id="filterVal">Canny Edge</span></div>
    </div>
  </div>
  <footer>Static demo: image + simulated stats updated with TypeScript.</footer>
  <script type="module" src="../dist/minimal/main.js"></script>
</body>
</html>
